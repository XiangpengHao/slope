[package]
# `slope` is taken on crates.io by an abandoned crate, so the package ships as
# `slope-cli` while the binary stays `slope` — the same split dioxus-cli/`dx`
# uses. `cargo install slope-cli` puts `slope` on PATH.
name = "slope-cli"
version = "0.1.0"
edition = "2024"
description = "Structural code review for large LLM-written changes to a cargo workspace"
authors = ["Xiangpeng Hao <xiangpeng.hao@wisc.edu>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/XiangpengHao/slope"
homepage = "https://github.com/XiangpengHao/slope"
readme = "README.md"
keywords = ["cargo", "code-review", "diff", "visualization", "dioxus"]
categories = ["development-tools", "visualization", "command-line-utilities"]
# An allowlist, not an `exclude` list, for one reason: `assets/tailwind.css` is
# generated and gitignored, and an `asset!` in main.rs needs it at compile time.
# Cargo's git-derived file list would drop it and the published crate would not
# build; `include` overrides that. Design notes and the spec stay out as repo
# furniture.
include = ["/src", "/assets", "/Cargo.toml", "/Cargo.lock", "/Dioxus.toml", "/clippy.toml", "/tailwind.css", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[[bin]]
name = "slope"
path = "src/main.rs"

[dependencies]
cargo_metadata = { version = "0.23.1", optional = true }
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
dioxus-flow = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["rt"], optional = true }
toml = { version = "1.1.4", optional = true }

# rust-analyzer as a library, for the code-structure altitude: items and
# semantically resolved references. Heavy, server-only; all crates must stay
# on one version. Bump the whole set together.
ra_ap_load-cargo = { version = "0.0.348", optional = true }
ra_ap_hir = { version = "0.0.348", optional = true }
ra_ap_ide_db = { version = "0.0.348", optional = true }
ra_ap_syntax = { version = "0.0.348", optional = true }
ra_ap_vfs = { version = "0.0.348", optional = true }
ra_ap_project_model = { version = "0.0.348", optional = true }
ra_ap_paths = { version = "0.0.348", optional = true }

# `dx` requires wasm-bindgen-cli to match the wasm-bindgen crate exactly, so this
# is pinned to the version the flake provides. Bump both together.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "History", "MediaQueryList"] }

[features]
default = ["web"]
# `dx serve` builds the client with `web` and the server with `server`, so each
# platform's deps must stay behind its own feature.
web = ["dioxus/web"]
# Workspace analysis (cargo metadata, VCS diff, manifest parsing, and the
# rust-analyzer code survey) only ever runs on the server; its deps stay off
# the wasm client entirely.
server = [
    "dioxus/server",
    "dep:cargo_metadata",
    "dep:toml",
    "dep:tokio",
    "dep:ra_ap_load-cargo",
    "dep:ra_ap_hir",
    "dep:ra_ap_ide_db",
    "dep:ra_ap_syntax",
    "dep:ra_ap_vfs",
    "dep:ra_ap_project_model",
    "dep:ra_ap_paths",
    "tokio/sync",
]

# Debug builds of the wasm client are enormous and slow without some opt.
[profile.dev.package."*"]
opt-level = 2
