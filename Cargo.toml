[workspace]
members = ["crates/dioxus-flow"]

[package]
name = "rust-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
# The pane, the camera and the layered auto-layout. Extracted so a second
# project can draw a graph without carrying this one's vocabulary.
dioxus-flow = { path = "crates/dioxus-flow" }
# Map data crosses the server-function boundary, so the graph types derive both.
serde = { version = "1", features = ["derive"] }

# `cargo metadata` output is parsed server-side only; the wasm client never
# shells out, so this stays behind the server feature.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"

# `dx` requires wasm-bindgen-cli to match the wasm-bindgen crate exactly, so this
# is pinned to the version the flake provides. Bump both together.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
# Canvas dash patterns take a JS array, and there is no web-sys shape for one.
# Already in the tree under web-sys, so this adds a name rather than a build.
js-sys = "0.3"
# The sheet draws to a canvas rather than to DOM nodes, so it talks to the
# browser directly: a context to paint into, a frame clock to animate on, and
# device pixel ratio so the ink is not soft on a scaled display.
web-sys = { version = "0.3", features = [
  # A trackpad pinch arrives as a ctrl+wheel event, and stopping the browser
  # from zooming the whole page instead needs a listener registered
  # `passive: false` — which means going around the framework to the element.
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "KeyboardEvent",
  "Performance",
  "TextMetrics",
  "WheelEvent",
  "Window",
] }

[features]
default = ["web"]
# `dx serve` builds the client with `web` and the server with `server`, so each
# platform's deps must stay behind its own feature.
web = ["dioxus/web"]
server = ["dioxus/server"]

# Debug builds of the wasm client are enormous and slow without some opt.
[profile.dev.package."*"]
opt-level = 2
